services:
  db:
    image: postgres:16-alpine
    container_name: dsa-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsa
      POSTGRES_PASSWORD: dsa
      POSTGRES_DB: dsa_tracker
    ports:
      - "5432:5432"
    volumes:
      - dsa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa -d dsa_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dsa-pgdata:
